# MyToken 本地开发 compose：web（nginx SPA+反代）+ server（Express 代理，8788）
# 本地 build（对应 Dockerfile 两个 target），不引用私有仓库镜像。
# 用法：docker compose up -d --build          （Web: http://127.0.0.1:${WEB_PORT:-8098}）
# 或：npm run dev + npm run dev:server        （不依赖 Docker 的纯本地开发）

services:
  web:
    build:
      context: .
      target: web
    image: mytoken-web:local
    container_name: mytoken-web
    ports:
      - "${WEB_PORT:-5200}:80"
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: .
      target: server
    image: mytoken-server:local
    container_name: mytoken-server
    ports:
      # 宿主 SERVER_PORT（默认 5201）→ 容器内代理 8788（本机 127.0.0.1:5201 可冒烟 /api/health）
      - "${SERVER_PORT:-5201}:8788"
    restart: unless-stopped
    environment:
      - PORT=8788
      - HOST=0.0.0.0
