# MyToken web 服务 nginx 配置（挂到 /etc/nginx/conf.d/default.conf）
# - HTTP(80): 强制 301 跳转到 HTTPS
# - HTTPS(443 ssl): SPA 回退 + /api/* 反代 server:8788 + 证书来自 /etc/nginx/ssl（:ro 卷）
# - 证书由宿主机 acme.sh/LE 维护，经 cert 卷挂载，nginx reload 热加载无需重建

# ---- HTTP → HTTPS 强制跳转（HTTPS 部署在宿主 WEB_PORT=5200，故跳转到 :5200）----
server {
    listen 80;
    server_name _;
    return 301 https://$host:5200$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/xml image/svg+xml;

    # 带指纹的静态资源：长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代：只转发到 server 服务容器的 8788（内部 http）
    location /api/ {
        proxy_pass http://server:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
