# MyToken web 服务 nginx 配置（挂到 /etc/nginx/conf.d/default.conf）
# - SPA 回退：try_files → /index.html
# - /api/* 反代到 server 服务容器的 8788（只转发到内部 server，不暴露外部任意地址）
# - gzip + 静态资源长缓存 + 安全头

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/xml image/svg+xml;

    # 带指纹的静态资源：长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代：只转发到 server 服务容器的 8788
    location /api/ {
        proxy_pass http://server:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
