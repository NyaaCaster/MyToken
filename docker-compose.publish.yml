# MyToken 发布 compose（macmini 等部署环境）：仅引用私有仓库镜像，无 build。
# 镜像地址一律经 ${PRIVATE_DOCKER_REGISTRY_HOST:?err} 注入，绝不硬编码。
# 用法（macmini 侧，nginx/alpine 本文件重命名为 docker-compose.yml 或经 restart.py）：
#   docker compose pull && docker compose up -d
# .. 实际由 restart.py 完成（pull → down → up -d → prune）。

services:
  web:
    image: ${PRIVATE_DOCKER_REGISTRY_HOST:?err}/mytoken-web:latest
    container_name: mytoken-web
    ports:
      - "${WEB_PORT:-8098}:80"
    restart: unless-stopped
    depends_on:
      - server

  server:
    image: ${PRIVATE_DOCKER_REGISTRY_HOST:?err}/mytoken-server:latest
    container_name: mytoken-server
    ports:
      # 可选：如需外部直连 Express 代理再放开（默认 nginx 内部反代已够用）
      - "8788:8788"
    restart: unless-stopped
    environment:
      - PORT=8788
      - HOST=0.0.0.0
