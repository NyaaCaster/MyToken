# MyToken 发布 compose（macmini 等部署环境）：仅引用私有仓库镜像，无 build。
# 镜像地址一律经 ${PRIVATE_DOCKER_REGISTRY_HOST:?err} 注入，绝不硬编码。
# 用法（macmini 侧，nginx/alpine 本文件重命名为 docker-compose.yml 或经 restart.py）：
#   docker compose pull && docker compose up -d
# .. 实际由 restart.py 完成（pull → down → up -d → prune）。

services:
  web:
    image: ${PRIVATE_DOCKER_REGISTRY_HOST:?err}/mytoken-web:latest
    container_name: mytoken-web
    ports:
      # HTTPS 主入口：宿主 WEB_PORT（5200）→ 容器 443
      - "${WEB_PORT:-5200}:443"
      # HTTP 跳转入口：宿主 HTTP_REDIRECT_PORT（5209）→ 容器 80（301→https）
      - "${HTTP_REDIRECT_PORT:-5209}:80"
    volumes:
      # 证书(LE SAN) 只读挂载进 nginx；由宿主机 acme.sh 续期后热加载
      - "${CERT_DIR:-./certs}:/etc/nginx/ssl:ro"
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - TZ=Asia/Shanghai

  server:
    image: ${PRIVATE_DOCKER_REGISTRY_HOST:?err}/mytoken-server:latest
    container_name: mytoken-server
    ports:
      # 宿主 SERVER_PORT（默认 5201）→ 容器内代理 8788
      - "${SERVER_PORT:-5201}:8788"
    restart: unless-stopped
    environment:
      - PORT=8788
      - HOST=0.0.0.0
      - TZ=Asia/Shanghai
